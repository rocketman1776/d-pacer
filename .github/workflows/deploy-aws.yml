# Pushing main or beta updates aws.dpacer.app: main at / and beta at /beta.
# Vercel still serves the live site. Leave refresh-beta.yml in place until cutover.
name: Deploy to AWS

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      S3_BUCKET: d-pacer
      CLOUDFRONT_DISTRIBUTION_ID: E2AZNBHJD1TPJK
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build main at / and beta at /beta
        env:
          VERCEL_ENV: production
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.VITE_CLOUDFLARE_ANALYTICS_TOKEN }}
        run: node scripts/build-site.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ "s3://${S3_BUCKET}/" --exclude "*" --include "*.html" --cache-control "no-cache"

      - name: Clear CloudFront HTML cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths /index.html /beta/* /privacy/* /terms/*
